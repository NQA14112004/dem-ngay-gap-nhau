<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Đếm ngược ngày mình gặp nhau</title>
  <meta name="description" content="Còn bao nhiêu ngày nữa là tới 28 tháng Chạp - ngày anh về với em." />
  <meta name="theme-color" content="#1b1033" />
  <!-- Trang riêng: ai có link vẫn mở được, chỉ là không lên Google. -->
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/base.css?v=015067cd" />
  <link rel="stylesheet" href="css/layout.css?v=015067cd" />
  <link rel="stylesheet" href="css/scenes.css?v=015067cd" />
  <link rel="stylesheet" href="css/particles.css?v=015067cd" />
  <link rel="stylesheet" href="css/finale.css?v=015067cd" />
</head>
<body data-scene="thu" data-buoi="toi">
  <!-- Nền: trời, quầng sáng, tranh SVG theo mùa, hạt rơi -->
  <div class="scene" aria-hidden="true">
    <div class="scene__sky"></div>
    <div class="scene__glow"></div>
    <div class="scene__art" id="scene-art"></div>
    <canvas class="scene__particles" id="particles"></canvas>
    <div class="scene__vignette"></div>
  </div>

  <main class="page">
    <p class="page__eyebrow" id="eyebrow">Anh đang đếm từng ngày để về với em</p>

    <section class="counter" aria-live="polite">
      <p class="counter__label">Còn</p>
      <p class="counter__number" id="days">&nbsp;</p>
      <p class="counter__unit" id="unit">ngày nữa</p>
    </section>

    <blockquote class="message">
      <p class="message__text" id="message">&nbsp;</p>
    </blockquote>

    <section class="dates">
      <p class="dates__line" id="today-line">&nbsp;</p>
      <p class="dates__line dates__line--target" id="target-line">&nbsp;</p>
    </section>

    <p class="tick" id="tick">&nbsp;</p>
  </main>

  <!-- Trình phát nhạc: nút chạy/tạm dừng và thanh âm lượng -->
  <div class="player" id="player" hidden>
    <button class="player__toggle" id="audio-toggle" type="button" aria-pressed="false" aria-label="Bật nhạc nền">
      <svg class="player__icon player__icon--play" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M4 2.5v11l9-5.5z" />
      </svg>
      <svg class="player__icon player__icon--pause" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="4" y="2.5" width="3" height="11" rx="1" />
        <rect x="9.5" y="2.5" width="3" height="11" rx="1" />
      </svg>
    </button>

    <svg class="player__speaker" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M7.5 2.5 4 5.5H2v5h2l3.5 3z" />
      <path class="player__wave" d="M10.5 5.5a3.5 3.5 0 0 1 0 5" fill="none" stroke-width="1.4" />
    </svg>

    <input
      class="player__volume"
      id="volume"
      type="range"
      min="0"
      max="100"
      step="1"
      value="45"
      aria-label="Âm lượng nhạc nền"
    />
  </div>

  <audio id="bgm" loop preload="auto"></audio>

  <!-- Màn hình ngày về, chỉ hiện khi đếm về 0 -->
  <div class="finale" id="finale" hidden>
    <canvas class="finale__fireworks" id="fireworks" aria-hidden="true"></canvas>
    <div class="finale__content">
      <p class="finale__eyebrow">28 tháng Chạp</p>
      <h1 class="finale__title">Anh về rồi</h1>
      <div class="finale__letter" id="finale-letter"></div>
      <p class="finale__sign" id="finale-sign"></p>
    </div>
  </div>

  <script type="module" src="js/main.js?v=015067cd"></script>
</body>
</html>
